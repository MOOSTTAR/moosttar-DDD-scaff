name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Central Portal 发布仓库用 User Token 认证（server id=central 对应 pom 的 distributionManagement）
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          # 导入 GPG 私钥，供 maven-gpg-plugin 签名
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
          cache: maven
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # central-publishing-maven-plugin 在 deploy 阶段上传 bundle 到 Central Portal，
      # autoPublish=true 会自动发布（无需手动 Publish），waitUntil=published 等发布完成。
      - name: Deploy to Maven Central
        run: mvn --batch-mode --no-transfer-progress clean deploy
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
