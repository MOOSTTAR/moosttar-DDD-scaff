name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # 将仓库级 GITHUB_TOKEN 写入 server id=github 的 settings.xml，
          # 与 pom.xml 中 distributionManagement.repository.id=github 对应
          server-id: github
          cache: maven

      - name: Publish with Maven
        run: mvn --batch-mode --no-transfer-progress clean deploy
