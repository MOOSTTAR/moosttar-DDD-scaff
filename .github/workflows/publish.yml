name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Central Portal 发布仓库用 User Token 认证（server id=central 对应 pom 的 distributionManagement）
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          # 导入 GPG 私钥，供 maven-gpg-plugin 签名
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
          cache: maven
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Deploy to Central Portal
        run: mvn --batch-mode --no-transfer-progress clean deploy
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # Central Portal 的 release 仓库 deploy 后默认是 staging 状态，
      # 需调用 publish API 触发对外发布，几分钟后同步到 Maven Central。
      - name: Publish release on Central Portal
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          curl -sS -X POST \
            -u "${{ secrets.CENTRAL_USERNAME }}:${{ secrets.CENTRAL_PASSWORD }}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"io.github.moosttar.moosttar-ddd-scaff-${VERSION}\"}" \
            https://central.sonatype.com/api/v1/publisher/publish
